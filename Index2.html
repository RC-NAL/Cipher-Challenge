
<!DOCTYPE html>
<html>
<head>
    <title>Cipher Challenge</title>

    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 700px;
        }

        #message {
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .cipher {
            font-size: 28px;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            width: 250px;
            max-width: 90%;
            text-align: center;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
        }

            button:hover {
                background-color: #ccc;
            }

        #result {
            display: none;
            margin-top: 30px;
        }

        #quote {
            color: #aaa;
            margin-top: 15px;
            font-style: italic;
        }

        #paragraph {
            margin-top: 25px;
            line-height: 1.7;
        }

        #wrong {
            color: #ff5555;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <p id="message"></p>

        <div class="cipher">
            YOUR ANSWER HERE
        </div>

        <input type="text" id="answer" placeholder="Enter the answer...">

        <br>

        <button onclick="checkAnswer()">Submit</button>

        <p id="wrong"></p>

        <div id="result">
            <h1>My crush is...</h1>

            <p id="quote"></p>

            <p id="paragraph">
                9EEA$]^^#4\?2=]89F3\Z@^4ZA96C\49R==6?86^
            </p>
        </div>

    </div>

    <script>
                document.getElementById("message").textContent = "Nb xifhs rh...";

                const correctAnswer = "My crush is...";

                const quotes = [
                    "Me gustan los gatos.",
                    "People who trys to bring you down is already below you...",
                    "You can do this I belive in you!",
                    "Every mystery has an answer. Unfortunately, this was it.",
                    "I admire your dedication, though was it for nothing?",
                    "The journey was questionable. The destination is yet to be known.",
                    "You could be doing literally anything else.",
                    "While they're out partying by the way, hus hus"
                ];

                function checkAnswer() {
                    const userAnswer = document.getElementById("answer").value.trim();

                    if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {

                        document.getElementById("result").style.display = "block";
                        document.getElementById("wrong").textContent = "";

                        const randomIndex = Math.floor(Math.random() * quotes.length);

                        document.getElementById("quote").textContent = quotes[randomIndex];

                    } else {
                        document.getElementById("wrong").textContent = "Incorrect. Try again.";
                    }
                }
    </script>

</body>
</html>
